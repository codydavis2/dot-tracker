{# New password + confirmation inputs, with the policy hint. Used everywhere a password is set. #}
<div class="mb-3">
    <input class="form-control" name="password" type="password" placeholder="{{ placeholder or 'Password' }}"
           minlength="{{ PASSWORD_MIN_LENGTH }}" maxlength="{{ PASSWORD_MAX_LENGTH }}" autocomplete="new-password" required>
    <div class="form-text">At least {{ PASSWORD_MIN_LENGTH }} characters. Avoid common passwords; a short phrase works well.</div>
</div>
<div class="mb-3">
    <input class="form-control" name="confirmation" type="password" placeholder="Confirm password"
           autocomplete="new-password" required>
</div>
