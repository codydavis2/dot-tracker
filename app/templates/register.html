{% extends "layout.html" %}
{% block title %}Register{% endblock %}
{% block main %}
<h2>Register</h2>
<form action="/register" method="post" class="col-md-4">
    <div class="mb-3">
        <input class="form-control" name="username" placeholder="Username" autofocus required>
    </div>
    <div class="mb-3">
        <input class="form-control" name="password" type="password" placeholder="Password" required>
    </div>
    <div class="mb-3">
        <input class="form-control" name="confirmation" type="password" placeholder="Confirm Password" required>
    </div>
    <button class="btn btn-primary" type="submit">Register</button>
</form>
{% endblock %}
