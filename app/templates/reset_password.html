{% extends "layout.html" %}
{% block title %}Choose a New Password{% endblock %}
{% block main %}
<h2>Choose a New Password</h2>
<p>For <strong>{{ email }}</strong></p>
<form action="/reset-password/{{ token }}" method="post" class="col-md-4">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    {% set placeholder = "New password" %}
    {% include "_password_fields.html" %}
    <button class="btn btn-primary" type="submit">Change Password</button>
</form>
{% endblock %}
