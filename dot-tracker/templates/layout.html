<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}{% endblock %} - DOT Fleet Tracker</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/static/styles.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark px-3">
        <a class="navbar-brand" href="/">DOT Fleet Tracker</a>
        {% if session.user_id %}
        <div class="ms-auto">
            <a class="btn btn-outline-light btn-sm" href="/vehicles">Vehicles</a>
            <a class="btn btn-outline-light btn-sm" href="/logout">Log Out</a>
        </div>
        {% endif %}
    </nav>

    <main class="container py-4">
        {% with messages = get_flashed_messages() %}
            {% if messages %}
                {% for message in messages %}
                    <div class="alert alert-warning">{{ message }}</div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        {% block main %}{% endblock %}
    </main>
</body>
</html>
